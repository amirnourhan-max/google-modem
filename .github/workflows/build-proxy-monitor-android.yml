name: Build Proxy Monitor Android

on:
  push:
    branches:
      - main
    paths:
      - 'android/proxy-monitor/**'
      - '.github/workflows/build-proxy-monitor-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android/proxy-monitor
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/proxy-monitor/app/build/outputs/apk/debug/app-debug.apk android/proxy-monitor/app/build/outputs/apk/debug/ProxyMonitorAndroid-v2.11-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyMonitorAndroid-v2.11-debug-apk
          path: android/proxy-monitor/app/build/outputs/apk/debug/ProxyMonitorAndroid-v2.11-debug.apk
          if-no-files-found: error

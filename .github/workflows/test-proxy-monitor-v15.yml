name: Test Proxy Monitor v15
on:
  pull_request:
    paths: ['openwrt/proxy-monitor/**', 'openwrt/mobile-api/**', 'tests/proxy-monitor/**', '.github/workflows/test-proxy-monitor-v15.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proxy-monitor-v15-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real ubusd, rpcd, UCI and ucode runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libjson-c-dev pkg-config libcrypt-dev
          sh tests/proxy-monitor/build-real-runtime.sh /tmp/pm-native-runtime /tmp/pm-native-build
      - name: Shell, generation, runtime, installation, rollback and API tests
        env:
          UCODE: /tmp/pm-native-runtime/bin/ucode
          PM_RPCD_PREFIX: /tmp/pm-native-runtime
          LD_LIBRARY_PATH: /tmp/pm-native-runtime/lib
        run: |
          python3 openwrt/proxy-monitor/build-installer.py
          git diff --exit-code -- openwrt/proxy-monitor/install-proxy-monitor-v15.sh
          sh -n openwrt/proxy-monitor/install-proxy-monitor-v15.sh
          sh -n openwrt/mobile-api/install-proxy-monitor-mobile-api-v7.sh
          sh -n openwrt/proxy-monitor/src/mobile.cgi
          sh -n openwrt/proxy-monitor/src/rpc-plugin.sh
          sudo env UCODE="$UCODE" PM_RPCD_PREFIX="$PM_RPCD_PREFIX" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" python3 -m unittest discover -s tests/proxy-monitor -v
      - name: Real browser testing with pinned Bootstrap theme
        run: |
          curl --fail --location https://raw.githubusercontent.com/openwrt/luci/d12d55376188343d790fa40377c084245a4d2b86/themes/luci-theme-bootstrap/htdocs/luci-static/bootstrap/cascade.css -o /tmp/bootstrap.css
          python3 tests/proxy-monitor/build-preview.py /tmp/bootstrap.css /tmp/preview.html
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/proxy-monitor/browser.mjs /tmp/preview.html
      - name: Preserve browser evidence without Actions artifact storage
        if: always()
        run: python3 tests/proxy-monitor/export-evidence.py
